# Exemple Linux à adapter : domaine, certificats et chemins réels.
server {
    listen 80;
    server_name stock.votre-domaine.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name stock.votre-domaine.com;
    ssl_certificate /etc/letsencrypt/live/stock.votre-domaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stock.votre-domaine.com/privkey.pem;
    client_max_body_size 7m;
    root /srv/chaibo/dist;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ { alias /srv/chaibo/backend/staticfiles/; }
    # Ne jamais exposer les photos en accès public.
    location /private-media/ { return 404; }
}
