# Utilisation : docker compose --env-file backend/.env up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chaibo}
      POSTGRES_USER: ${POSTGRES_USER:-chaibo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Générer backend/.env avec python backend/setup_env.py}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
