name: chaibo
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    image: chaibo-backend:${RELEASE_SHA:?}
    build: ./backend
    restart: unless-stopped
    env_file: ${CHAIBO_ENV_FILE:?}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "0"
      DJANGO_TRUST_PROXY: "1"
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - /srv/chaibo/shared/uploads:/app/uploads
      - /srv/chaibo/shared/static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health/',headers={'Host':os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=4).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
volumes:
  postgres_data:
    name: chaibo_postgres
