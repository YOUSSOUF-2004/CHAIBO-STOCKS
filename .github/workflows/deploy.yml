name: Tests et déploiement CHAIBO STOCK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chaibo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chaibo_ci
          POSTGRES_USER: chaibo_ci
          POSTGRES_PASSWORD: ci-isolated-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chaibo_ci -d chaibo_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production-0123456789012345678901234567890123456789
      DJANGO_DEBUG: '1'
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173
      POSTGRES_DB: chaibo_ci
      POSTGRES_USER: chaibo_ci
      POSTGRES_PASSWORD: ci-isolated-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: |
          python -m pip install -r backend/requirements.lock
          npm ci
      - name: Vérifier Django et les migrations
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py test core --noinput
      - name: Vérifier React
        run: npm test
      - name: Vérifier le parcours React et Django
        env:
          CHAIBO_TEST_API: http://127.0.0.1:8000
          CHAIBO_TEST_ADMIN_PHONE: '+23566999999'
          CHAIBO_TEST_ADMIN_PASSWORD: CI-Only-Administrator!8264
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py shell -c "import os; from core.models import User; User.objects.create_superuser(os.environ['CHAIBO_TEST_ADMIN_PHONE'],os.environ['CHAIBO_TEST_ADMIN_PASSWORD'],name='CI Administrator')"
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/chaibo-django.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/health/ >/dev/null
          npm run test:api
      - name: Compiler React pour Django
        env:
          VITE_API_MODE: api
        run: npm run build
      - name: Préparer la livraison
        run: |
          tar --exclude='backend/.env' --exclude='backend/.venv' --exclude='backend/uploads' --exclude='backend/staticfiles' --exclude='__pycache__' --exclude='*.pyc' -czf /tmp/chaibo-release.tar.gz dist backend compose.production.yaml deploy README.md
      - uses: actions/upload-artifact@v4
        with:
          name: chaibo-${{ github.sha }}
          path: /tmp/chaibo-release.tar.gz
          retention-days: 14
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_VPS_DEPLOY == 'true'
    needs: test-and-package
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chaibo-${{ github.sha }}
          path: release
      - name: Configurer SSH avec vérification du serveur
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Transférer et déployer la version testée
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes release/chaibo-release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/srv/chaibo/incoming/$RELEASE_SHA.tar.gz"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $RELEASE_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          target="/srv/chaibo/releases/$sha"
          mkdir -p "$target"
          tar -xzf "/srv/chaibo/incoming/$sha.tar.gz" -C "$target"
          bash "$target/deploy/release.sh" "$sha"
          REMOTE
      - name: Effacer la clé du runner
        if: always()
        run: rm -f ~/.ssh/id_ed25519
